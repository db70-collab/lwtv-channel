name: Aggiorna e pubblica il sito

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"      # ogni ora, al minuto 17: controlla se c'è un nuovo video
  workflow_dispatch:           # permette di lanciarlo a mano dal pulsante "Run workflow"

permissions:
  contents: write              # per salvare l'elenco dei video in data/
  pages: write
  id-token: write

concurrency:
  group: pubblicazione-sito
  cancel-in-progress: true

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Calcola l'indirizzo del sito
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ -f CNAME ]; then
            DOMINIO="$(tr -d '[:space:]' < CNAME)"
            echo "SITE_URL=https://$DOMINIO" >> "$GITHUB_ENV"
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          elif [[ "$REPO" == *.github.io ]]; then
            echo "SITE_URL=https://$REPO" >> "$GITHUB_ENV"
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://$OWNER.github.io/$REPO" >> "$GITHUB_ENV"
            echo "BASE_PATH=/$REPO" >> "$GITHUB_ENV"
          fi

      - name: Genera il sito
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python build.py

      - name: Salva l'elenco dei video
        run: |
          git config user.name "lwtv-bot"
          git config user.email "lwtv-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna elenco video"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  pubblica:
    needs: genera
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
